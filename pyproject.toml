[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "peakrdl-html-single"
version = "0.1.0"
description = "PeakRDL exporter for self-contained interactive HTML documentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "peakrdl-cli>=1.5",
    "systemrdl-compiler>=1.32",
]

[project.entry-points."peakrdl.exporters"]
html-single = "peakrdl_html_single.__peakrdl__:Exporter"

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/peakrdl_html_single"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
